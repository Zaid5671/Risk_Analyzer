# Render Blueprint for the Drishti API (FastAPI backend).
# Render dashboard -> New -> Blueprint -> select this repository.
# DATABASE_URL is entered in the dashboard when the Blueprint is created (never committed).
services:
  - type: web
    name: drishti-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements-api.txt
    # One worker: the in-memory caches and login rate limiter live in this process
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      # Public demo: account creation disabled, demo logins only
      - key: DEMO_MODE
        value: "true"
      # Supabase connection string (same value as DATABASE_URL in your local .env)
      - key: DATABASE_URL
        sync: false
      # Fresh random signing key generated by Render; never reuse the local one
      - key: JWT_SECRET_KEY
        generateValue: true
